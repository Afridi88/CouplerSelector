<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Optical Fiber Coupler Selector</title>

  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #eef2f7;
      margin: 0;
      padding: 40px;
    }

    .container {
      max-width: 950px;
      margin: auto;
      background: white;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    .header {
      background: #12395b;
      color: white;
      padding: 24px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 1px;
    }

    .header p {
      margin-top: 8px;
      opacity: 0.9;
    }

    .content {
      padding: 35px;
    }

    .grid {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 18px 24px;
      align-items: center;
    }

    label {
      font-weight: 600;
      color: #12395b;
      font-size: 16px;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #bfc8d4;
      background: #fff9db;
      font-size: 15px;
    }

    .result-section {
      margin-top: 35px;
    }

    .result-title {
      background: #12395b;
      color: white;
      padding: 10px 14px;
      border-radius: 8px 8px 0 0;
      font-weight: bold;
    }

    .result-box {
      background: #edf7e9;
      border: 1px solid #cfd8cc;
      padding: 18px;
      min-height: 70px;
      border-radius: 0 0 8px 8px;
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-line;
    }

    .footer {
      text-align: center;
      padding: 18px;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>OPTICAL FIBER COUPLER SELECTOR</h1>
    <p>Industrial Fiber Patch Cord Coupler Recommendation System</p>
  </div>

  <div class="content">

    <div class="grid">

      <label for="wavelength">Laser Wavelength</label>
      <select id="wavelength">
        <option value="">Select Wavelength</option>
      </select>

      <label for="ferrule">Patch Cord Termination</label>
      <select id="ferrule">
        <option value="">Select Ferrule</option>
      </select>

      <label for="endface">End Face Type</label>
      <select id="endface">
        <option value="">Select End Face</option>
      </select>

    </div>

    <div class="result-section">
      <div class="result-title">Recommended Coupler</div>
      <div class="result-box" id="couplerResult">
        Waiting for selection...
      </div>
    </div>

    <div class="result-section">
      <div class="result-title">Technical Comments / Notes</div>
      <div class="result-box" id="commentResult">
        Waiting for selection...
      </div>
    </div>

  </div>

  <div class="footer">
    Optical Fiber Laboratory Coupler Recommendation Tool
  </div>

</div>

const wavelengthSelect = document.getElementById("wavelength");
const ferruleSelect = document.getElementById("ferrule");
const endfaceSelect = document.getElementById("endface");

const couplerResult = document.getElementById("couplerResult");
const commentResult = document.getElementById("commentResult");

function populateDropdown(selectElement, values) {
  values.forEach(value => {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = value;
    selectElement.appendChild(option);
  });
}

const wavelengths = [...new Set(database.map(d => d.wavelength))];
const ferrules = [...new Set(database.map(d => d.ferrule))];
const endfaces = [...new Set(database.map(d => d.endface))];

populateDropdown(wavelengthSelect, wavelengths);
populateDropdown(ferruleSelect, ferrules);
populateDropdown(endfaceSelect, endfaces);

function searchCoupler() {

  const wavelength = wavelengthSelect.value;
  const ferrule = ferruleSelect.value;
  const endface = endfaceSelect.value;

  if (!wavelength || !ferrule || !endface) {
    couplerResult.textContent = "Waiting for complete selection...";
    commentResult.textContent = "Waiting for complete selection...";
    return;
  }

  const match = database.find(item =>
    item.wavelength === wavelength &&
    item.ferrule === ferrule &&
    item.endface === endface
  );

  if (match) {
    couplerResult.textContent = match.coupler;
    commentResult.textContent = match.comments || "No comments available.";
  }
  else {
    couplerResult.textContent = "No matching coupler found.";
    commentResult.textContent = "";
  }
}

wavelengthSelect.addEventListener("change", searchCoupler);
ferruleSelect.addEventListener("change", searchCoupler);
endfaceSelect.addEventListener("change", searchCoupler);
