<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Optical Fiber Coupler Selector</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Segoe UI", Arial, sans-serif;
    background:#eef2f7;
    padding:12px;
    color:#1c2733;
}

.container{
    max-width:950px;
    margin:auto;
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 4px 20px rgba(0,0,0,0.12);
}

.header{
    background:#12395b;
    color:white;
    padding:24px 18px;
    text-align:center;
}

.header h1{
    font-size:32px;
    line-height:1.2;
    margin-bottom:6px;
}

.header p{
    opacity:0.9;
    font-size:15px;
}

.content{
    padding:18px;
}

.grid{
    display:grid;
    grid-template-columns:220px 1fr;
    gap:16px 18px;
    align-items:center;
}

label{
    font-weight:600;
    color:#12395b;
    font-size:15px;
}

select{
    width:100%;
    min-height:50px;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid #c6cfdb;
    font-size:16px;
    background:white;
    outline:none;
    transition:0.2s;
}

select:focus{
    border-color:#12395b;
    box-shadow:0 0 0 3px rgba(18,57,91,0.15);
}

select:disabled{
    background:#f1f3f5;
    color:#888;
}

.result-section{
    margin-top:24px;
}

.result-title{
    background:#12395b;
    color:white;
    padding:12px 14px;
    font-weight:600;
    border-radius:10px 10px 0 0;
    font-size:15px;
}

.result-box{
    background:#edf7e9;
    border:1px solid #d5ddd2;
    border-top:none;
    padding:18px;
    min-height:100px;
    border-radius:0 0 10px 10px;
    line-height:1.7;
    font-size:15px;
    overflow-wrap:break-word;
    white-space:pre-line;
}

.badge{
    display:inline-block;
    background:#12395b;
    color:white;
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
    margin-bottom:10px;
}

.empty{
    color:#777;
}

.footer{
    text-align:center;
    padding:18px;
    color:#666;
    font-size:13px;
}

@media (max-width:768px){

    body{
        padding:8px;
    }

    .header{
        padding:18px 14px;
    }

    .header h1{
        font-size:22px;
    }

    .header p{
        font-size:13px;
    }

    .content{
        padding:14px;
    }

    .grid{
        grid-template-columns:1fr;
        gap:12px;
    }

    label{
        margin-top:4px;
    }

    .result-box{
        min-height:80px;
        font-size:14px;
    }

}

@media (prefers-color-scheme: dark){

    body{
        background:#101418;
        color:#f2f2f2;
    }

    .container{
        background:#1c232d;
    }

    label{
        color:#dbe7f5;
    }

    select{
        background:#2b3440;
        color:white;
        border:1px solid #4d5967;
    }

    select:disabled{
        background:#232b35;
    }

    .result-box{
        background:#26303a;
        border-color:#42505e;
        color:white;
    }

    .footer{
        color:#b9c0c8;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="header">
        <h1>OPTICAL FIBER COUPLER SELECTOR</h1>
        <p>Industrial Fiber Patch Cord Coupler Recommendation System</p>
    </div>

    <div class="content">

        <div class="grid">

            <label for="wavelength">
                Laser Wavelength
            </label>

            <select id="wavelength">
                <option value="">Select Wavelength</option>
            </select>

            <label for="ferrule">
                Patch Cord Termination
            </label>

            <select id="ferrule" disabled>
                <option value="">Select Ferrule</option>
            </select>

            <label for="endface">
                End Face Type
            </label>

            <select id="endface" disabled>
                <option value="">Select End Face</option>
            </select>

        </div>

        <div class="result-section">

            <div class="result-title">
                Recommended Coupler
            </div>

            <div class="result-box" id="couplerResult">
                <span class="empty">
                    Waiting for complete selection...
                </span>
            </div>

        </div>

        <div class="result-section">

            <div class="result-title">
                Technical Comments / Notes
            </div>

            <div class="result-box" id="commentResult">
                <span class="empty">
                    Waiting for complete selection...
                </span>
            </div>

        </div>

    </div>

    <div class="footer">
        Optical Fiber Laboratory Coupler Recommendation Tool
    </div>

</div>

<script>

/* ======================================================
   DATABASE
====================================================== */

const database = [

{
    wavelength:"405 nm",
    ferrule:"FC",
    endface:"Flat",
    coupler:"SN:35-1R2(S), SN:91-01R, SN:87-01, CE002855",
    comments:""
},

{
    wavelength:"405 nm",
    ferrule:"FC",
    endface:"Endcap Angle",
    coupler:"SN:50-01",
    comments:""
},

{
    wavelength:"488 nm",
    ferrule:"FC",
    endface:"Flat",
    coupler:"SN:93-1R3(S)",
    comments:""
},

{
    wavelength:"530 nm",
    ferrule:"FC",
    endface:"Flat",
    coupler:"SN:63-02(S), SN:63-01(S), SN:68-01(S)",
    comments:"SN:63-01 and SN:68-01 provide high power."
},

{
    wavelength:"635 nm",
    ferrule:"FC",
    endface:"Flat",
    coupler:"SN:58-01, SN:88-01, SN:30-2",
    comments:""
},

{
    wavelength:"780 nm",
    ferrule:"FC",
    endface:"Flat",
    coupler:"SN:06-01R(S), SN:17-01R2(S)",
    comments:"Works well for airgap FC angle endcap."
},

{
    wavelength:"850 nm",
    ferrule:"FC",
    endface:"Flat",
    coupler:"SN:49-1R(S)",
    comments:""
},

{
    wavelength:"980 nm",
    ferrule:"FC",
    endface:"Flat",
    coupler:"57-03R",
    comments:""
},

{
    wavelength:"1060 nm",
    ferrule:"FC",
    endface:"Flat",
    coupler:"SN:58-02(S), SN:61-01(S), SN:99-02(S)",
    comments:""
},

{
    wavelength:"1310 nm",
    ferrule:"FC",
    endface:"Flat",
    coupler:"SN:00-05",
    comments:""
},

{
    wavelength:"1550 nm",
    ferrule:"FC",
    endface:"Flat",
    coupler:"SN:02-9R2(S), SN:49-1(S)",
    comments:""
}

];

/* ======================================================
   ELEMENTS
====================================================== */

const wavelengthSelect = document.getElementById("wavelength");
const ferruleSelect = document.getElementById("ferrule");
const endfaceSelect = document.getElementById("endface");

const couplerResult = document.getElementById("couplerResult");
const commentResult = document.getElementById("commentResult");

/* ======================================================
   FUNCTIONS
====================================================== */

function unique(values){

    return [...new Set(values)];

}

function populateSelect(select, values, placeholder){

    select.innerHTML = "";

    const defaultOption = document.createElement("option");

    defaultOption.value = "";
    defaultOption.textContent = placeholder;

    select.appendChild(defaultOption);

    values.forEach(value => {

        const option = document.createElement("option");

        option.value = value;
        option.textContent = value;

        select.appendChild(option);

    });

}

function resetResults(){

    couplerResult.innerHTML =
        `<span class="empty">Waiting for complete selection...</span>`;

    commentResult.innerHTML =
        `<span class="empty">Waiting for complete selection...</span>`;

}

/* ======================================================
   INITIALIZE WAVELENGTHS
====================================================== */

const wavelengths = unique(
    database.map(item => item.wavelength)
);

populateSelect(
    wavelengthSelect,
    wavelengths,
    "Select Wavelength"
);

/* ======================================================
   WAVELENGTH SELECTION
====================================================== */

wavelengthSelect.addEventListener("change", () => {

    const wavelength = wavelengthSelect.value;

    resetResults();

    ferruleSelect.disabled = true;
    endfaceSelect.disabled = true;

    populateSelect(
        ferruleSelect,
        [],
        "Select Ferrule"
    );

    populateSelect(
        endfaceSelect,
        [],
        "Select End Face"
    );

    if(!wavelength) return;

    const ferrules = unique(

        database
        .filter(item => item.wavelength === wavelength)
        .map(item => item.ferrule)

    );

    populateSelect(
        ferruleSelect,
        ferrules,
        "Select Ferrule"
    );

    ferruleSelect.disabled = false;

});

/* ======================================================
   FERRULE SELECTION
====================================================== */

ferruleSelect.addEventListener("change", () => {

    const wavelength = wavelengthSelect.value;
    const ferrule = ferruleSelect.value;

    resetResults();

    endfaceSelect.disabled = true;

    populateSelect(
        endfaceSelect,
        [],
        "Select End Face"
    );

    if(!ferrule) return;

    const endfaces = unique(

        database
        .filter(item =>

            item.wavelength === wavelength &&
            item.ferrule === ferrule

        )
        .map(item => item.endface)

    );

    populateSelect(
        endfaceSelect,
        endfaces,
        "Select End Face"
    );

    endfaceSelect.disabled = false;

});

/* ======================================================
   END FACE SELECTION
====================================================== */

endfaceSelect.addEventListener("change", () => {

    const wavelength = wavelengthSelect.value;
    const ferrule = ferruleSelect.value;
    const endface = endfaceSelect.value;

    if(!endface){

        resetResults();
        return;

    }

    const match = database.find(item =>

        item.wavelength === wavelength &&
        item.ferrule === ferrule &&
        item.endface === endface

    );

    if(match){

        couplerResult.innerHTML = `

            <div class="badge">
                Recommended
            </div>

            <div>
                ${match.coupler || "No coupler available."}
            </div>

        `;

        commentResult.innerHTML =

            match.comments
            ? match.comments
            : `<span class="empty">No comments available.</span>`;

    }

    else{

        couplerResult.innerHTML =
            `<span class="empty">No matching coupler found.</span>`;

        commentResult.innerHTML =
            `<span class="empty">No comments available.</span>`;

    }

});

</script>

</body>
</html>
